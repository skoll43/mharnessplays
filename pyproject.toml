[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mharnessplays"
version = "0.1.0"
description = "Pixel-only dual-loop Game Boy agent bootstrap"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "mharnessplays contributors" }]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["llm_harness", "tests/test_harnesses.py", "tests/test_router_permissions.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []
